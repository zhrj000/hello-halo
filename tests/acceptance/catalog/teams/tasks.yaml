version: 1
id: teams.tasks
module: teams
title:
  en: Work in the right task and member view
  zh: 在正确任务与成员中工作
story:
  en: I can switch tasks and members without mixing their discussions.
  zh: 我能切换任务和成员，而不混淆他们的讨论。
basis: documented
references:
  - src/renderer/components/team/workbench/DESIGN.md
  - src/renderer/components/canvas/DESIGN.md
  - src/main/apps/team/DESIGN.md
  - tests/e2e/specs/team-render.spec.ts
promises:
  scope:
    en: Selecting a member changes the member view within the selected task.
    zh: 切换成员只切换当前任务中的成员视图。
  draft:
    en: Each task/member draft remains recoverable after a rejected send.
    zh: 各任务及成员草稿在发送被拒绝后可恢复。
  ownership:
    en: A teammate-owned member remains read-only and does not grant private chat access.
    zh: 队友拥有的成员保持只读，不因此获得私聊权限。
  lifetime:
    en: Archived tasks remain readable and reopen only on a human request.
    zh: 归档任务仍可读，仅在人的请求下重新开启。
  optional-goal:
    en: I can assemble a standing team without a standing goal and give it instructions when starting work.
    zh: 我能在不设常驻目标的情况下组建持久团队，开始工作时再给出指示。
  layout:
    en: The task room and its drawers remain usable in narrow layouts and both themes.
    zh: 任务房间及抽屉在窄屏和两种主题中仍可使用。
scenarios:
  - id: teams.tasks.homepage
    title:
      en: Open team conversations from the home conversation list
      zh: 从首页会话列表打开团队对话
    verifies: [scope, ownership, layout]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: ui
    mode: none
    automation: planned
    variants:
      entry: [desktop, remote-web]
      width: [wide, narrow]
    preconditions:
      - en: A controlled space has personal chats, two team conversations, and a read-only teammate lead.
        zh: 隔离空间中有个人会话、两条团队对话及仅查看的队友 Lead。
    steps:
      - en: Open a team conversation under Digital humans, switch its members near the composer, then switch to a personal chat and return through the old team entry.
        zh: 在数字人分类打开团队对话，于输入框附近切换成员，再切到个人会话并从旧团队入口返回。
    expected:
      - en: Switching members keeps the same conversation with separate member histories and drafts.
        zh: 切换成员仍在同一对话中，成员记录与草稿各自独立。
      - en: The homepage and team workbench retain their respective entry points to the same conversation; the homepage shows the members as a left-aligned avatar rail above the composer, followed in the same capsule by the conversation status, with nothing else on that row and nothing inside the composer, switching with one click and lifting the current member with its name shown; read-only members are dimmed after a separator, a large team collapses the rest behind a "+N" entry beside the avatars that opens the all-members panel grouped into needs your attention, working, my digital humans and read-only members (searchable past eight members), ordering stays stable, and a read-only member cannot receive input, while the composer stays in place, locked, with the reason written inside.
        zh: 首页和团队工作台各自保留进入同一对话的入口；首页在输入框上方以靠左的头像轨道展示成员，对话状态紧随其后同在一个胶囊内，该行没有其他控件，也不在输入框内，单击即可切换，当前成员被托起并显示名字；仅查看成员置灰并以分隔点隔开，成员较多时其余收进头像旁的“+N”入口，点开为全部成员面板，按需要你处理、工作中、我的数字人与仅查看成员分组（超过八人时可搜索），顺序稳定，仅查看成员不能接收输入，但输入框仍在原位，处于锁定状态并写明原因。
      - en: The canvas remains available and the selector is usable at narrow widths.
        zh: 画布保留，窄屏下仍能切换成员。
  - id: teams.tasks.homepage-list-consistency
    title:
      en: Use the same list interactions for team and personal conversations
      zh: 团队会话与个人会话使用一致的列表交互
    verifies: [scope, layout]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: ui
    mode: none
    automation: planned
    variants:
      entry: [desktop, remote-web]
      width: [wide, narrow]
    preconditions:
      - en: A space has both a personal digital-human conversation and a team conversation.
        zh: 空间中有数字人个人会话与团队会话。
    steps:
      - en: Expand each group, select and pin a conversation, and rename it through its more menu.
        zh: 展开两类分组，选择并置顶会话，再通过更多菜单重命名。
    expected:
      - en: Both use consistent spacing, selection, hover and accessible touch controls; only supported actions are offered. Team headers, pinned conversations and compact entries share up to four tightly overlapping member faces from the available list summary, lead first when available, within the same 18px footprint as a personal avatar. There is no backing plate or outer border; only individual face separators follow the theme background. Two faces are centered side by side, three use two above one centered below, one uses a single face and none uses the team initial. No empty cells are shown. Changing the chat recipient does not change the team avatar or open a member picker from it.
        zh: 两者具有一致的间距、选中、悬停与可访问触控操作，且只展示支持的操作。团队分组、置顶会话及收起入口复用列表摘要中最多四位成员紧密交叠的头像，有 Lead 时排首位，整体与个人头像同为 18px。不显示底板背景或外框，只保留随主题背景变化的单头像分隔线。两位居中并排，三位上二下一且下方居中，一位显示单头像，无成员信息时显示团队首字，不显示空格。切换聊天成员不改变团队头像，头像不打开成员选择器。
      - en: Personal and team group names start at the same horizontal position using equal-width avatar slots and the same action columns. Both avatars' left edges align with the Digital Humans section label. Nested conversation titles align with these names; status indicators stay in the left gutter without shifting titles. Clicking a team avatar opens that team's details, not a conversation or a group toggle; the name and chevron still expand or collapse the group. The new-conversation button retains its behavior.
        zh: 个人与团队分组共用等宽头像列和操作列，两类头像左边缘与“数字人”分类标签对齐，名称起点对齐。分组内会话标题与名称左对齐，状态点放在左侧留白，不挤动标题。点击团队头像进入该团队详情，不打开会话或切换分组；名称及箭头仍展开或收起分组，新建会话按钮保持原有行为。
      - en: Renaming or pinning affects only the chosen conversation and never completes or deletes team work.
        zh: 重命名或置顶只影响所选会话，不会完成或删除团队工作。
  - id: teams.tasks.homepage-list-scope
    title:
      en: See only my own team conversations on the home list
      zh: 首页只列出与我相关的团队对话
    verifies: [scope, ownership]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: ui
    mode: none
    automation: planned
    variants:
      entry: [desktop, remote-web]
    preconditions:
      - en: A team with two people has a conversation I started, one a teammate started with my digital human, one a teammate started without it, and one waiting on my answer.
        zh: 两人团队中有我发起的对话、队友与我的数字人发起的对话、队友未涉及我的对话，以及一条等待我回答的对话。
    steps:
      - en: Open the home list and expand the team group; hover the teammate-started row.
        zh: 打开首页列表并展开团队分组，悬停在队友发起的对话上。
    expected:
      - en: The list shows my conversations, those waiting on me, and teammate-started ones my digital human took part in within the last 7 days, as one flat list; the unrelated one is absent. Starting a conversation shows who began it in the hover card, and a team with no conversation keeps its header with the new-conversation button. Scrolling to the end loads older ones.
        zh: 列表平铺展示我发起的、等待我回答的，以及近 7 天内我的数字人参与的队友对话，无关对话不出现；悬停卡片说明发起人；没有对话的团队保留分组头与新建按钮；滚动到底加载更早的对话。
  - id: teams.tasks.homepage-list-remove
    title:
      en: Remove a team conversation from the home list only
      zh: 仅从首页列表移除团队对话
    verifies: [scope, lifetime]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: ui
    mode: none
    automation: planned
    variants:
      entry: [desktop, remote-web]
      width: [wide, narrow]
    preconditions:
      - en: A pinned team conversation and an ordinary one exist, both visible on the home list.
        zh: 首页列表中有一条置顶团队对话和一条普通团队对话。
    steps:
      - en: Remove each through its more menu and confirm; then let a teammate ask me a new question in one, and reopen the other from the team page.
        zh: 通过更多菜单分别移除并确认；随后让队友在其中一条向我提新问题，并从团队详情页重新打开另一条。
    expected:
      - en: Removal asks for confirmation, drops the row from the list (and its pin) and leaves the task and its history untouched in the team. A new question awaiting me, or my reopening or sending in it, brings the row back; ordinary activity does not. The menu also offers a way to view the task in the team.
        zh: 移除需确认，行（及置顶）从列表消失，团队中的任务和记录不受影响；出现等待我回答的新问题，或我主动重新打开、发送消息时该行回到列表，普通动态不会让它回来；菜单另提供在团队中查看。
  - id: teams.tasks.homepage-room-panel
    title:
      en: Talk in a team conversation without a pane header
      zh: 在无面板头部的团队对话中交流
    verifies: [scope, ownership, layout]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: ui
    mode: none
    automation: planned
    variants:
      entry: [desktop, remote-web]
      width: [wide, narrow]
    preconditions:
      - en: A teammate started a conversation in which one of my digital humans took part.
        zh: 队友发起的对话中有我的一位数字人参与。
    steps:
      - en: Open it from the home list, read the top bar, open the all-members panel from the conversation status and follow its bottom-right link, then use the list row's more menu.
        zh: 从首页列表打开，查看顶栏，从对话状态打开全部成员面板并点击右下角链接，再使用列表行的更多菜单。
    expected:
      - en: The top bar (also on narrow screens) carries the conversation title and the pane has no header of its own. The participating digital human is selected by default, and the conversation bar has no menu of its own. The panel link opens Team progress in the canvas beside the chat (not a drawer), even before the board has any task; the list row menu renames the conversation and views it in the team.
        zh: 顶栏（含窄屏）显示对话标题，面板自身没有头部；默认选中参与的数字人，对话栏没有单独的菜单。面板链接在聊天旁的画布中打开团队进度（而非抽屉），看板尚无任务时也可用；列表行菜单负责重命名和在团队中查看。
  - id: teams.tasks.homepage-progress
    title:
      en: Follow who is doing what without leaving the home conversation
      zh: 不离开首页对话就能看到谁在做什么
    verifies: [scope, layout]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: ui
    mode: none
    automation: planned
    variants:
      entry: [desktop, remote-web]
      width: [wide, narrow]
      theme: [light, dark]
    preconditions:
      - en: In a home team conversation the Lead has handed work to two members; one is working, one asks me a question, and a message to a third never arrived.
        zh: 首页团队对话中 Lead 已把工作交给两位成员：一位工作中，一位向我提问，另有一条发给第三位的消息未送达。
    steps:
      - en: Read the conversation bar above the composer, open its panel from the status and from "+N", answer from it, view the failure, then open the full progress, fold and unfold subtask groups, open an output from the overview and open its subpages; repeat with nothing to report and at a narrow width.
        zh: 查看输入框上方的对话条，分别从状态和“+N”打开面板，从面板去回答，查看失败，再打开完整进展，展开收起子任务分组，从总览打开一份产出并进入各子页；在无可报告状态及窄屏下重复。
    expected:
      - en: The member avatars, their "+N" chip, a divider and the conversation status form one capsule; the stream has no progress card. The status shows an icon, a one-line summary (waiting for me, failed, waiting for a decision, working, "Completed · N outputs" or "Team progress") and, when there are board tasks, the done/total count and a bar filled only by done tasks, then a chevron that is always there and opens the panel upward even when there is nothing to report. The status always reads in full with no ellipsis; at narrow widths the bar hides first, then avatars fold into "+N". A working member's avatar has a blue dot at its corner, one waiting for me an orange one and a failed one a red one, in the bar and the panel alike; nothing in the bar animates. The current member's row in the panel is highlighted and member names are not truncated.
        zh: 成员头像、“+N”、分隔线与对话状态组成一个胶囊，消息流中不再有进展卡片。状态显示图标、一句话摘要（等你处理、失败、等待决策、工作中、“已完成 · N 份成果”或“团队进展”），有看板任务时显示已完成/总任务数和仅按已完成填充的进度条，最后是始终存在的箭头，即使没有可报告的状态也能向上打开面板。状态始终完整显示、不出现省略号：窄屏时进度条先隐藏，再把头像收进“+N”。工作中成员头像右下角为蓝点，等你处理为橙点，失败为红点，对话条与面板一致；对话条上没有任何动画。面板中当前成员所在行高亮，成员名字不被截断。
      - en: The status and "+N" open the same all-members panel, never on their own. It starts with the team progress and done count, groups members into needs your attention, working, my digital humans and read-only members with what each is doing; "Answer" switches to that member and the question, "View" opens the failure in the collaboration history.
        zh: 状态与“+N”打开同一个全部成员面板，不会自动弹出。面板顶部为团队进展与完成数，成员按需要你处理、工作中、我的数字人、仅查看分组并显示各自在做什么；“去回答”切到该成员及其问题，“查看”在协作记录中打开失败记录。
      - en: Under the Lead's reply a single "Sent a message to X" line replaces the per-member dispatch rows, and failed deliveries no longer appear as rows in the stream; they are told in the conversation bar. Expanded, each message's "To X" heading, and with a single recipient also the footer's "View X's conversation", switches to X in the same conversation with that message expanded and in view; X's "Received a report from Lead" line leads back to the Lead the same way. A message from or to the main chat has a plain heading and leads to team progress instead.
        zh: Lead 回复下方以一行“已发消息给 X”代替逐条派发记录，投递失败不再作为消息流中的行出现，而在对话条上说明。展开后每条消息的“发送给 X”标题（只有一位收件人时还有底部的“查看 X 的对话”）可在同一对话中切到 X，并展开、定位到这条消息；X 那边“收到了 Lead 的报告”同样可切回 Lead。来自或发往主对话的消息标题不可点击，仍进入团队进度。
      - en: The link at the bottom right of the panel opens Team progress in the canvas, showing a status line, a brief naming only what needs me (once done, how long it took and how much of it waited on people), subtasks grouped as waiting on you, errored, in progress, not started yet and completed, the outputs listed in place newest first (beyond five the rest unfold in place), and links to the collaboration record and members, the members page listing the whole roster with each one's concrete work; opening it again reuses the same tab. The bar stays readable at narrow widths and in both themes. The team workbench keeps its own activity drawer unchanged.
        zh: 面板右下角链接在画布中打开“团队进度”：状态行、只点出需要我处理之事的简报（完成后给出用时及其中等人确认的时长）、按待你确认/出错/进行中/待开始/已完成分组的子任务、直接列出的产出（最新在前，超过五个可就地展开其余），以及进入协作记录和成员的入口，成员页列出全部成员及各自的具体工作；再次打开复用同一标签页。窄屏和两种主题下对话条仍可读。团队工作台保留原有活动抽屉不变。
      - en: When the Lead ends the work as done, or every subtask is done or rejected with nobody working, waiting or failed, the bar reads "Completed · N outputs" and the progress shows "Completed · took X", a brief saying what was done (the closing summary only when the Lead ended the work, else how many subtasks completed), how much of that time waited on people and the output count or "No output files", then the outputs right below it with nothing to scroll to, and all subtasks in a folded completed group; a new message or subtask turns it back to in progress.
        zh: Lead 结束工作，或所有子任务均已完成或被拒绝且没有成员在工作、等待或失败时，对话条显示“已完成 · N 份成果”，进度显示“已完成 · 用时 X”，简报说明完成了什么（仅在 Lead 结束工作时显示收尾总结，否则为几个子任务已完成）、其中等人确认的时长，以及产出份数或“没有产出文件”，产出紧接在简报下方、无需滚动，所有子任务收在折叠的已完成分组中；发出新消息或新增子任务后恢复为进行中。
  - id: teams.tasks.conversation-entry
    title:
      en: Begin a team conversation without task onboarding
      zh: 不经过任务引导开始团队对话
    verifies: [scope, layout]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: ui
    mode: none
    automation: planned
    variants:
      entry: [desktop, remote-web]
      width: [wide, narrow]
    steps:
      - en: Open a new team conversation and inspect the empty chat before sending.
        zh: 打开新的团队对话，发送前查看空白聊天界面。
    expected:
      - en: The user can chat with the selected member without task creation instructions or a complete-task control.
        zh: 用户可与选中成员聊天，界面不显示创建任务的引导或完成任务控件。
  - id: teams.tasks.member-draft
    title:
      en: Switch members with different drafts
      zh: 带不同草稿切换成员
    verifies:
      - scope
      - draft
    platforms: &a1
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: ui
    mode: none
    automation: planned
    preconditions:
      - en: Two owned members have different unsent drafts in one task.
        zh: 同一任务中两位自己的成员各有不同草稿。
    steps:
      - en: Switch members, trigger a rejected send and return.
        zh: 切换成员，触发发送被拒绝后再返回。
    expected:
      - en: The correct member and draft are retained inside the same task.
        zh: 同一任务中保留正确成员及其草稿。
  - id: teams.tasks.readonly
    title:
      en: Inspect a teammate’s work
      zh: 查看队友的工作
    verifies:
      - ownership
    platforms: *a1
    profiles:
      - regression
    evidence: ui
    mode: none
    automation: automated
    preconditions:
      - en: The task includes a member owned on another machine.
        zh: 任务含另一机器拥有的成员。
    steps:
      - en: Select that member and inspect history and member details.
        zh: 选择该成员，查看历史与成员详情。
    expected:
      - en: History is readable where authorized, with no editable composer for that member.
        zh: 授权范围内历史可读，该成员无可编辑输入框。
  - id: teams.tasks.archive
    title:
      en: Archive and deliberately reopen a task
      zh: 归档并主动重开任务
    verifies:
      - lifetime
    platforms: *a1
    profiles:
      - regression
    evidence: integration
    mode: scripted
    automation: planned
    preconditions:
      - en: A task has completed work and history.
        zh: 任务已有完成工作及历史。
    steps:
      - en: Archive, deliver a background wake, then explicitly reopen it.
        zh: 归档，投递后台唤醒，再主动重开。
    expected:
      - en: Background work cannot reopen the task; explicit reopening retains history.
        zh: 后台事件不能重开任务；主动重开后历史保留。
  - id: teams.tasks.task-switch
    title:
      en: Keep task conversations and activity separate
      zh: 保持任务对话和活动独立
    verifies:
      - scope
      - draft
    platforms: &a2
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: ui
    mode: none
    automation: automated
    preconditions:
      - en: Use the isolated fixture described by the referenced executable test.
        zh: 使用引用测试中定义的隔离测试资料。
    steps:
      - en: Type a draft, select a second task and its activity, then return.
        zh: 输入草稿，选择另一任务及其活动，再返回。
    expected:
      - en: Each task shows its own conversation and activity and the original draft returns.
        zh: 各任务显示自己的对话与活动，原草稿恢复。
  - id: teams.tasks.send-rejected
    title:
      en: Recover a rejected message after member switching
      zh: 成员切换后恢复被拒绝消息
    verifies:
      - draft
    platforms: *a2
    profiles:
      - regression
    evidence: ui
    mode: none
    automation: automated
    preconditions:
      - en: Use the isolated fixture described by the referenced executable test.
        zh: 使用引用测试中定义的隔离测试资料。
    steps:
      - en: Send through a rejecting fixture and switch away and back.
        zh: 通过会拒绝发送的测试处理器发消息，切走后回来。
    expected:
      - en: The rejected text returns to the intended member composer.
        zh: 被拒绝文字回到正确成员输入框。
  - id: teams.tasks.first-send
    title:
      en: Save a team conversation on its first submitted message
      zh: 首次发送消息时保存团队对话
    verifies:
      - scope
    platforms: *a2
    profiles:
      - regression
    evidence: ui
    mode: none
    automation: automated
    preconditions:
      - en: Use the isolated fixture described by the referenced executable test.
        zh: 使用引用测试中定义的隔离测试资料。
    steps:
      - en: Open a new team conversation, type a message and send.
        zh: 打开新团队对话，输入消息并发送。
    expected:
      - en: No conversation appears before submit and exactly one corresponding conversation appears after it.
        zh: 提交前不出现对话，提交后只出现一个对应对话。
  - id: teams.tasks.conversation-no-assignment
    title:
      en: Starting a conversation does not itself assign board work
      zh: 创建团队对话本身不分配看板工作
    verifies: [scope]
    platforms: *a2
    profiles: [regression]
    evidence: integration
    mode: none
    automation: planned
    preconditions:
      - en: An isolated team has no assigned board tasks.
        zh: 隔离团队没有已分配的看板任务。
    steps:
      - en: Create a native team conversation without invoking any member or task tool.
        zh: 创建团队对话，不唤醒成员或调用任务工具。
    expected:
      - en: The conversation is retained without inserting a board task; a subsequent member turn may explicitly create work.
        zh: 对话被保存且不新增看板任务；后续成员执行时可以主动创建工作。
  - id: teams.tasks.rename
    title:
      en: Rename a task consistently
      zh: 一致地重命名任务
    verifies:
      - scope
    platforms: *a2
    profiles:
      - regression
    evidence: ui
    mode: none
    automation: automated
    preconditions:
      - en: Use the isolated fixture described by the referenced executable test.
        zh: 使用引用测试中定义的隔离测试资料。
    steps:
      - en: Cancel a proposed title, then save a different title.
        zh: 取消一个新标题，再保存另一个标题。
    expected:
      - en: Cancel leaves the original; save updates both the room and task-list title.
        zh: 取消保留原名，保存同时更新任务房间及列表。
  - id: teams.tasks.first-send-rejected
    title:
      en: Keep a rejected first message recoverable
      zh: 保留发送失败的首条消息
    verifies:
      - draft
    platforms: *a2
    profiles:
      - regression
    evidence: ui
    mode: none
    automation: automated
    preconditions:
      - en: Use the isolated fixture described by the referenced executable test.
        zh: 使用引用测试中定义的隔离测试资料。
    steps:
      - en: Create a task whose first send is rejected, switch tasks and return.
        zh: 创建首条发送被拒绝的任务，切换任务后返回。
    expected:
      - en: The new task is retained with its original unsent text.
        zh: 新任务保留，其原未发送文字仍在。
  - id: teams.tasks.readonly-kind
    title:
      en: Inspect read-only channel and run history
      zh: 查看只读渠道与运行历史
    verifies:
      - ownership
    platforms:
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: ui
    mode: none
    automation: automated
    preconditions:
      - en: Use isolated seeded data and the production UI with the fixture boundary stated below.
        zh: 使用隔离预置数据及真实界面，测试替换边界见说明。
    steps:
      - en: Open each read-only history kind and its task activity drawer.
        zh: 打开各只读历史类型及任务活动抽屉。
    expected:
      - en: The history and activity remain available without a composer or sender picker.
        zh: 历史和活动可查看，但没有输入框或发送者选择器。
    variants:
      kind:
        - im
        - run
  - id: teams.tasks.observer-only
    title:
      en: Inspect a team without owning a member
      zh: 没有自有成员时查看团队
    verifies:
      - ownership
    platforms:
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: ui
    mode: none
    automation: automated
    preconditions:
      - en: Prepare an isolated workspace with the records and failure conditions described by this scenario.
        zh: 在隔离空间准备本场景所述记录及失败条件。
    steps:
      - en: Open a task as a viewer with no owned team members.
        zh: 作为没有自有团队成员的查看者打开任务。
    expected:
      - en: Activity remains accessible and neither composer nor sender selection grants sending authority.
        zh: 活动仍可查看，输入框与发送者选择不会授予发言权限。
  - id: teams.tasks.narrow-drawers
    title:
      en: Read expanded task activity on a narrow screen
      zh: 窄屏阅读展开的任务活动
    verifies:
      - layout
    platforms: &a3
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: ui
    mode: none
    automation: automated
    preconditions:
      - en: Use isolated representative data for the selected product surface.
        zh: 为选定功能使用隔离的代表性数据。
    steps:
      - en: At 375px expand coordination, open activity and close it with Escape in light and dark themes.
        zh: 在 375px 下展开协作并打开活动，在明暗主题中用 Escape 关闭。
    expected:
      - en: The composer and preview remain usable, the drawer fits and closing returns to the task.
        zh: 输入框及预览可用，抽屉适配，关闭返回任务。
  - id: teams.tasks.pending-rejection
    title:
      en: Restore rejected text after a quick member round trip
      zh: 快速切换成员后恢复被拒绝文字
    verifies:
      - draft
    platforms: *a3
    profiles:
      - regression
    evidence: ui
    mode: none
    automation: automated
    preconditions:
      - en: Use isolated representative data for the selected product surface.
        zh: 为选定功能使用隔离的代表性数据。
    steps:
      - en: Submit through a delayed rejection fixture, switch members and return before it settles.
        zh: 通过延迟拒绝的测试处理器提交，结束前切换成员并返回。
    expected:
      - en: The eventual rejection restores the original text in the active matching composer.
        zh: 最终拒绝将原文字恢复到匹配的活动输入框。

  - id: teams.tasks.temporary-participants
    title:
      en: Keep temporary collaborators inside their task
      zh: 临时协作者只出现在所属任务中
    verifies: [scope, draft, ownership, layout]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: ui
    mode: none
    automation: automated
    preconditions:
      - en: An isolated renderer fixture provides a standing team with two tasks, local and remote temporary participants in only the first task, and a pending local participant decision.
        zh: 隔离界面数据提供一个持久团队和两个任务，只有第一个任务含本地及远端临时参与者，并含本地参与者待确认事项。
    steps:
      - en: Select each temporary participant, inspect its history, switch tasks and return with an unsent draft.
        zh: 选择各临时参与者并读取历史，带未发送草稿切换任务再返回。
      - en: Inspect a temporary participant's activity, open standing team settings, then use the member drawer at mobile width in both themes.
        zh: 查看临时参与者活动并打开常驻团队设置，再在手机宽度下使用两种主题的成员抽屉。
      - en: Deliver a burst of member status notifications while observing reads for the selected work.
        zh: 连续投递成员状态通知，并观察当前任务的读取请求。
    expected:
      - en: Temporary participants and their histories appear only in their task; a local participant can be addressed and its decision is reachable, while a remote participant remains read-only.
        zh: 临时参与者及历史只出现在所属任务；可向本地参与者发消息并看到其待确认事项，远端参与者保持只读。
      - en: The task/member draft survives switching. Temporary participants are absent from standing member settings, and the narrow layout does not overflow.
        zh: 任务及成员草稿在切换后保留；临时参与者不进入常驻成员设置，窄屏不横向溢出。
      - en: Status notifications refresh the lightweight roster without rereading full activity history.
        zh: 状态通知仅刷新轻量成员信息，不重新读取完整活动历史。
    notes:
      en: Application handlers are replaced. This verifies renderer ownership and interaction, not backend participant creation, federation or model decisions.
      zh: 应用接口使用替身；验证界面所有权与交互，不证明后端参与者创建、跨端同步或模型决策。

  - id: teams.tasks.optional-goal
    title:
      en: Create a standing team without requiring a goal
      zh: 创建持久团队时不强制填写目标
    verifies: [optional-goal]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: ui
    mode: none
    automation: automated
    preconditions:
      - en: An isolated renderer fixture provides a workspace and existing digital humans and records the creation request.
        zh: 隔离界面数据提供工作空间和已有数字人，并记录创建请求。
    steps:
      - en: Open New team, enter a name, select an existing member, leave the goal empty and create.
        zh: 打开新建团队，输入名称并选择已有成员，目标留空后创建。
    expected:
      - en: Creation is submitted once with an empty goal, the dialog closes after success, and no empty goal panel is offered.
        zh: 创建请求携带空目标且只提交一次，成功后对话框关闭，不展示空目标面板。
    notes:
      en: This verifies form admission and request shape. Application creation and persistence are separate backend evidence.
      zh: 验证表单准入和请求形状；应用创建与持久化需要独立后端证据。
