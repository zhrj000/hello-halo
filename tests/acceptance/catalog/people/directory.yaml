version: 1
id: people.directory
module: people
title:
  en: Find a digital human
  zh: 找到需要的数字人
story:
  en: I can find a person by name or team and return to the same list.
  zh: 我能按名字或团队找到数字人，并回到原列表。
basis: observed
references:
  - src/renderer/components/apps/PeopleDirectory.tsx
  - tests/e2e/specs/people-upgrade.spec.ts
promises:
  browse:
    en: Search, paging and return navigation preserve list context and include persistent coordinators.
    zh: 搜索、分页和返回保留列表上下文，长期协调者也能找到。
  recipient:
    en: Locally owned persistent team members, including automatically created leads, can be selected for personal chats in their workspace. The composer identifies the current person independently of the new-chat candidate list. Temporary collaborators and other people's team members do not gain personal-chat access.
    zh: 当前空间内自有的长期团队成员，包括自动创建的 Lead，可被选择进行个人聊天。输入框独立于新聊天候选列表显示当前对象身份；临时协作者和他人的团队成员不会因此获得个人私聊入口。
  scale:
    en: Large directories remain bounded and usable at narrow widths.
    zh: 大量数字人时列表仍有限加载，窄屏也可操作。
  live-status:
    en: A digital human working a team turn reads as working wherever its status shows — the space rail, the people switcher and the directory — and a team lead appears in its space’s rail marked as the team lead, without a Chat action there; it stays selectable as a recipient in the composer.
    zh: 正在处理团队任务的数字人，在所有显示状态的地方（空间右栏、人员切换条、目录）都显示为工作中；团队 Lead 出现在所在空间的右栏并标为团队 Lead，右栏不提供聊天按钮，但在输入框中仍可选为收件人。
  tags:
    en: I can put my own tags on digital humans and MCP servers, filter a list by one tag, find items by a tag through search, and rename or delete a tag across that list; tags stay on this computer and never change the item itself.
    zh: 我能给数字人和 MCP 服务打上自己的标签，按一个标签筛选列表，搜索时能命中标签，并能在该列表内重命名或删除标签；标签只保存在本机，不改变条目本身。
scenarios:
  - id: people.directory.team-work-status
    title:
      en: See a team member at work outside the team view
      zh: 在团队视图之外看到正在工作的团队成员
    verifies:
      - live-status
    platforms:
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    preconditions:
      - en: A saved team with its lead and a member installed in the current space; no scheduled run is in progress.
        zh: 当前空间有一个已保存团队，含 Lead 和一名成员；没有定时运行在进行。
    steps:
      - en: Send the member a message in the team view, then look at the space rail’s digital humans tab and the people switcher while it answers, and after it finishes.
        zh: 在团队视图给成员发消息，在其回复期间及结束后查看空间右栏数字人标签和人员切换条。
    expected:
      - en: The member reads Working while it answers and Standing by afterwards; the lead is listed with a team lead mark and no Chat action.
        zh: 成员回复期间显示工作中，结束后显示待命；Lead 带团队 Lead 标识列出，且无聊天入口。
  - id: people.directory.tags
    title:
      en: Tag, filter, rename and delete
      zh: 打标签、筛选、重命名和删除
    verifies:
      - tags
    platforms:
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: planned
    preconditions:
      - en: More than one page of digital humans, none tagged.
        zh: 超过一页的数字人，均无标签。
    steps:
      - en: Open a card's ⋯ → Tags…, type a new tag and press Enter, tick it on another card, click the tag in the row, search for it, rename it, then delete it; repeat on the MCP list and at a width below 640px.
        zh: 打开卡片 ⋯ → 标签…，输入新标签并回车，在另一张卡片上勾选它，点击标签行中的它，搜索它，重命名，再删除；在 MCP 列表和 640px 以下宽度重复。
    expected:
      - en: The row appears with the first tag, filtering and search show exactly the tagged items across pages, rename and delete apply to every tagged item of that list, and the row disappears when no tag remains.
        zh: 有第一个标签后标签行出现；筛选和搜索跨页准确显示带该标签的条目；重命名和删除作用于该列表所有带标签的条目；没有标签时标签行消失。
  - id: people.directory.browse
    title:
      en: Search, open and return to the directory
      zh: 搜索、查看并返回目录
    verifies:
      - browse
    platforms: &a1
      - darwin
      - win32
      - linux
    profiles:
      - fast
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Seed multiple digital humans and a persistent team coordinator.
        zh: 预置多个数字人与长期团队协调者。
    steps:
      - en: Search by team, open a person’s settings, return and page the list.
        zh: 按团队搜索，进入个人设置，返回并翻页。
    expected:
      - en: The correct people appear, search text is retained and pages stay bounded.
        zh: 显示正确数字人，搜索词保留，分页大小受控。
  - id: people.directory.team-recipient
    title:
      en: Start a personal chat with an owned persistent team member
      zh: 与自有长期团队成员开始个人聊天
    verifies: [recipient]
    platforms: *a1
    profiles: [regression]
    evidence: app-e2e
    mode: none
    automation: planned
    variants:
      entry: [desktop, remote-web]
      width: [wide, narrow]
    preconditions:
      - en: The workspace contains an owned persistent lead and member, a temporary collaborator, and a team peer owned elsewhere.
        zh: 空间中包含自有长期 Lead 与成员、临时协作者及他人拥有的团队成员。
    steps:
      - en: Open a personal chat with each owned persistent member from their details and from the composer recipient picker.
        zh: 分别从详情和输入框候选菜单打开每位自有长期成员的个人聊天。
    expected:
      - en: Each selected person's name and avatar agree between the empty chat and composer; candidate filtering never replaces an available current identity with a generic label.
        zh: 空会话与输入框显示一致的当前成员姓名和头像，候选过滤不会使已知当前身份退化成通用标签。
      - en: Temporary collaborators and remote peers are absent from personal-chat candidates, and no team history is copied into the personal chat.
        zh: 个人聊天候选中不出现临时协作者和他人的成员，团队历史不会复制进个人聊天。
  - id: people.directory.scale
    title:
      en: Browse a large directory on a narrow screen
      zh: 窄屏浏览大量数字人
    verifies:
      - scale
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Seed 200 people and pending requests.
        zh: 预置 200 位数字人与待处理请求。
    steps:
      - en: Browse at desktop, 375px and 320px in both themes.
        zh: 在桌面、375px 与 320px 下切换两种主题浏览。
    expected:
      - en: Cards remain paged, detail controls remain reachable and the page does not overflow horizontally.
        zh: 卡片分页显示，详情控件可达，页面不横向溢出。
